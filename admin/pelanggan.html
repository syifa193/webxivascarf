<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Pelanggan - XivaScarf Admin</title>

  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <div class="admin-layout">

    <aside class="admin-sidebar">
      <div class="sidebar-brand">
        <i class="bi bi-heart-pulse-fill text-primary"></i>
        <span>XivaScarf Admin</span>
      </div>

      <ul class="sidebar-menu">
        <li class="nav-item"><a href="dashboard.html" class="nav-link"><i class="bi bi-grid-fill"></i> Dashboard</a></li>
        <li class="nav-item"><a href="produk.html" class="nav-link"><i class="bi bi-box-seam"></i> Produk Jilbab</a></li>
        <li class="nav-item"><a href="kategori.html" class="nav-link"><i class="bi bi-tags"></i> Kategori</a></li>
        <li class="nav-item"><a href="pesanan.html" class="nav-link"><i class="bi bi-bag-check"></i> Kelola Pesanan</a></li>
        <li class="nav-item"><a href="pelanggan.html" class="nav-link active"><i class="bi bi-people"></i> Data Pelanggan</a></li>
        <li class="nav-item"><a href="laporan.html" class="nav-link"><i class="bi bi-file-earmark-bar-graph"></i> Laporan Penjualan</a></li>
        <li class="nav-item"><a href="profil.html" class="nav-link"><i class="bi bi-person-gear"></i> Profil Admin</a></li>
      </ul>

      <div class="p-3 border-top">
        <a href="#" class="btn btn-outline-danger w-100 btn-logout"><i class="bi bi-box-arrow-right me-1"></i> Keluar</a>
      </div>
    </aside>

    <main class="admin-content">
      <header class="admin-header">
        <div class="d-flex align-items-center gap-3">
          <button class="btn btn-xiva-secondary d-lg-none" onclick="toggleAdminSidebar()">
            <i class="bi bi-list fs-5"></i>
          </button>
          <div>
            <h3 class="brand-font fw-bold mb-1">Data Pelanggan Terdaftar</h3>
            <p class="text-muted mb-0">Daftar kontak dan alamat pengiriman pengguna XivaScarf</p>
          </div>
        </div>
      </header>

      <div class="card card-xiva p-4">
        <div class="row mb-3">
          <div class="col-md-6">
            <input type="text" id="search-pelanggan" class="form-control" placeholder="Cari nama atau email pelanggan...">
          </div>
        </div>

        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead class="table-light">
              <tr>
                <th>#</th>
                <th>Nama Pelanggan</th>
                <th>Email</th>
                <th>No WhatsApp</th>
                <th>Alamat Utama</th>
                <th>Total Transaksi</th>
              </tr>
            </thead>
            <tbody id="admin-pelanggan-table-body">
              <!-- Rendered dynamically -->
            </tbody>
          </table>
        </div>
      </div>
    </main>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/auth.js"></script>
  <script>AuthModule.requireAuth('admin');</script>
  <script src="../js/role.js"></script>
  <script src="../js/produk.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderAdminPelangganTable();

      document.getElementById('search-pelanggan').addEventListener('input', renderAdminPelangganTable);
    });

    function renderAdminPelangganTable() {
      const tbody = document.getElementById('admin-pelanggan-table-body');
      const search = document.getElementById('search-pelanggan').value.trim().toLowerCase();

      const users = DBStore.getCollection(DBStore.KEYS.USERS).filter(u => u.role === 'user');
      const orders = DBStore.getCollection(DBStore.KEYS.PESANAN);

      let filtered = users;
      if (search) {
        filtered = users.filter(u => u.nama.toLowerCase().includes(search) || u.email.toLowerCase().includes(search));
      }

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-muted">Belum ada pelanggan terdaftar.</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map((u, idx) => {
        const userOrders = orders.filter(o => o.uid === u.uid);
        const totalBelanja = userOrders.reduce((sum, o) => sum + o.total, 0);

        return `
          <tr>
            <td>${idx + 1}</td>
            <td>
              <div class="d-flex align-items-center gap-2">
                <div class="stat-icon primary p-2" style="width: 36px; height: 36px; font-size: 0.9rem;">
                  <i class="bi bi-person-fill"></i>
                </div>
                <strong>${u.nama}</strong>
              </div>
            </td>
            <td>${u.email}</td>
            <td>${u.nohp || '-'}</td>
            <td><small class="text-muted">${u.alamat || '-'}</small></td>
            <td>
              <span class="badge bg-light text-dark border">
                ${userOrders.length} Pesanan (${ProductModule.formatRupiah(totalBelanja)})
              </span>
            </td>
          </tr>
        `;
      }).join('');
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil Admin - XivaScarf Admin</title>

  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <div class="admin-layout">

    <aside class="admin-sidebar">
      <div class="sidebar-brand">
        <i class="bi bi-heart-pulse-fill text-primary"></i>
        <span>XivaScarf Admin</span>
      </div>

      <ul class="sidebar-menu">
        <li class="nav-item"><a href="dashboard.html" class="nav-link"><i class="bi bi-grid-fill"></i> Dashboard</a></li>
        <li class="nav-item"><a href="produk.html" class="nav-link"><i class="bi bi-box-seam"></i> Produk Jilbab</a></li>
        <li class="nav-item"><a href="kategori.html" class="nav-link"><i class="bi bi-tags"></i> Kategori</a></li>
        <li class="nav-item"><a href="pesanan.html" class="nav-link"><i class="bi bi-bag-check"></i> Kelola Pesanan</a></li>
        <li class="nav-item"><a href="pelanggan.html" class="nav-link"><i class="bi bi-people"></i> Data Pelanggan</a></li>
        <li class="nav-item"><a href="laporan.html" class="nav-link"><i class="bi bi-file-earmark-bar-graph"></i> Laporan Penjualan</a></li>
        <li class="nav-item"><a href="profil.html" class="nav-link active"><i class="bi bi-person-gear"></i> Profil Admin</a></li>
      </ul>

      <div class="p-3 border-top">
        <a href="#" class="btn btn-outline-danger w-100 btn-logout"><i class="bi bi-box-arrow-right me-1"></i> Keluar</a>
      </div>
    </aside>

    <main class="admin-content">
      <header class="admin-header">
        <div class="d-flex align-items-center gap-3">
          <button class="btn btn-xiva-secondary d-lg-none" onclick="toggleAdminSidebar()">
            <i class="bi bi-list fs-5"></i>
          </button>
          <div>
            <h3 class="brand-font fw-bold mb-1">Pengaturan Profil Admin</h3>
            <p class="text-muted mb-0">Kelola informasi identitas akun pengelola sistem</p>
          </div>
        </div>
      </header>

      <div class="row">
        <div class="col-lg-8">
          <div class="card card-xiva p-4">
            <form id="admin-profile-form">
              <div class="mb-3">
                <label for="admin-nama" class="form-label">Nama Pengelola</label>
                <input type="text" id="admin-nama" class="form-control" required>
              </div>

              <div class="mb-3">
                <label for="admin-email" class="form-label">Email Administrator</label>
                <input type="email" id="admin-email" class="form-control" required>
              </div>

              <div class="mb-3">
                <label for="admin-nohp" class="form-label">Nomor WhatsApp / Telepon</label>
                <input type="text" id="admin-nohp" class="form-control">
              </div>

              <div class="mb-4">
                <label for="admin-alamat" class="form-label">Alamat Kantor / Toko</label>
                <textarea id="admin-alamat" class="form-control" rows="3"></textarea>
              </div>

              <button type="submit" class="btn btn-xiva-primary">
                <i class="bi bi-check-lg me-1"></i> Simpan Perubahan Profil
              </button>
            </form>
          </div>
        </div>
      </div>
    </main>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/auth.js"></script>
  <script>AuthModule.requireAuth('admin');</script>
  <script src="../js/role.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const user = AuthModule.getCurrentUser();
      if (user) {
        document.getElementById('admin-nama').value = user.nama || '';
        document.getElementById('admin-email').value = user.email || '';
        document.getElementById('admin-nohp').value = user.nohp || '';
        document.getElementById('admin-alamat').value = user.alamat || '';
      }

      document.getElementById('admin-profile-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const users = DBStore.getCollection(DBStore.KEYS.USERS);
        const idx = users.findIndex(u => u.uid === user.uid);
        if (idx !== -1) {
          users[idx].nama = document.getElementById('admin-nama').value.trim();
          users[idx].email = document.getElementById('admin-email').value.trim();
          users[idx].nohp = document.getElementById('admin-nohp').value.trim();
          users[idx].alamat = document.getElementById('admin-alamat').value.trim();

          DBStore.setCollection(DBStore.KEYS.USERS, users);
          AuthModule.setCurrentUser(users[idx]);
          showToast('Profil admin berhasil diperbarui!', 'success');
          
          setTimeout(() => {
            window.location.reload();
          }, 1000);
        }
      });
    });
  </script>
</body>
</html>

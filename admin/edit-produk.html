<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <div class="admin-layout">

    <aside class="admin-sidebar">
      <div class="sidebar-brand">
        <i class="bi bi-heart-pulse-fill text-primary"></i>
        <span>XivaScarf Admin</span>
      </div>

      <ul class="sidebar-menu">
        <li class="nav-item"><a href="dashboard.html" class="nav-link"><i class="bi bi-grid-fill"></i> Dashboard</a></li>
        <li class="nav-item"><a href="produk.html" class="nav-link active"><i class="bi bi-box-seam"></i> Produk Jilbab</a></li>
        <li class="nav-item"><a href="kategori.html" class="nav-link"><i class="bi bi-tags"></i> Kategori</a></li>
        <li class="nav-item"><a href="pesanan.html" class="nav-link"><i class="bi bi-bag-check"></i> Kelola Pesanan</a></li>
        <li class="nav-item"><a href="pelanggan.html" class="nav-link"><i class="bi bi-people"></i> Data Pelanggan</a></li>
        <li class="nav-item"><a href="laporan.html" class="nav-link"><i class="bi bi-file-earmark-bar-graph"></i> Laporan Penjualan</a></li>
        <li class="nav-item"><a href="profil.html" class="nav-link"><i class="bi bi-person-gear"></i> Profil Admin</a></li>
      </ul>

      <div class="p-3 border-top">
        <a href="#" class="btn btn-outline-danger w-100 btn-logout"><i class="bi bi-box-arrow-right me-1"></i> Keluar</a>
      </div>
    </aside>

    <main class="admin-content">
      <header class="admin-header">
        <div class="d-flex align-items-center gap-3">
          <button class="btn btn-xiva-secondary d-lg-none" onclick="toggleAdminSidebar()">
            <i class="bi bi-list fs-5"></i>
          </button>
          <div>
            <h3 class="brand-font fw-bold mb-1">Edit Produk Jilbab</h3>
            <p class="text-muted mb-0">Ubah rincian informasi dan stok produk</p>
          </div>
        </div>

        <a href="produk.html" class="btn btn-xiva-secondary">
          <i class="bi bi-arrow-left me-1"></i> Batal / Kembali
        </a>
      </header>

      <div class="row">
        <div class="col-lg-8">
          <div class="card card-xiva p-4">
            <form id="product-form">
              <input type="hidden" id="idProduk">

              <div class="mb-3">
                <label for="nama" class="form-label">Nama Produk Jilbab</label>
                <input type="text" id="nama" class="form-control" required>
              </div>

              <div class="row mb-3">
                <div class="col-md-6">
                  <label for="kategori" class="form-label">Kategori</label>
                  <select id="kategori" class="form-select" required>
                    <!-- Populated dynamically -->
                  </select>
                </div>
                <div class="col-md-6">
                  <label for="harga" class="form-label">Harga Produk (Rp)</label>
                  <input type="number" id="harga" class="form-control" min="0" required>
                </div>
              </div>

              <div class="row mb-3">
                <div class="col-md-6">
                  <label for="stok" class="form-label">Jumlah Stok</label>
                  <input type="number" id="stok" class="form-control" min="0" required>
                </div>
                <div class="col-md-6">
                  <label for="ukuran" class="form-label">Ukuran / Dimensi</label>
                  <input type="text" id="ukuran" class="form-control">
                </div>
              </div>

              <div class="mb-3">
                <label for="warna" class="form-label">Pilihan Warna</label>
                <input type="text" id="warna" class="form-control">
              </div>

              <div class="mb-3">
                <label for="deskripsi" class="form-label">Deskripsi Produk</label>
                <textarea id="deskripsi" class="form-control" rows="4"></textarea>
              </div>

              <div class="mb-4">
                <label class="form-label">Upload atau Tautan Gambar Produk</label>
                <input type="url" id="gambar-url" class="form-control mb-2">
                <input type="file" id="gambar-file" class="form-control" accept="image/*">
              </div>

              <button type="submit" class="btn btn-xiva-primary btn-lg w-100">
                <i class="bi bi-check-lg me-2"></i> Perbarui Produk Jilbab
              </button>
            </form>
          </div>
        </div>

        <div class="col-lg-4">
          <div class="card card-xiva p-4 text-center">
            <h6 class="fw-bold mb-3 text-muted">Pratinjau Gambar Produk</h6>

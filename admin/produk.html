<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kelola Produk - XivaScarf Admin</title>

  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <div class="admin-layout">

    <aside class="admin-sidebar">
      <div class="sidebar-brand">
        <i class="bi bi-heart-pulse-fill text-primary"></i>
        <span>XivaScarf Admin</span>
      </div>

      <ul class="sidebar-menu">
        <li class="nav-item"><a href="dashboard.html" class="nav-link"><i class="bi bi-grid-fill"></i> Dashboard</a></li>
        <li class="nav-item"><a href="produk.html" class="nav-link active"><i class="bi bi-box-seam"></i> Produk Jilbab</a></li>
        <li class="nav-item"><a href="kategori.html" class="nav-link"><i class="bi bi-tags"></i> Kategori</a></li>
        <li class="nav-item"><a href="pesanan.html" class="nav-link"><i class="bi bi-bag-check"></i> Kelola Pesanan</a></li>
        <li class="nav-item"><a href="pelanggan.html" class="nav-link"><i class="bi bi-people"></i> Data Pelanggan</a></li>
        <li class="nav-item"><a href="laporan.html" class="nav-link"><i class="bi bi-file-earmark-bar-graph"></i> Laporan Penjualan</a></li>
        <li class="nav-item"><a href="profil.html" class="nav-link"><i class="bi bi-person-gear"></i> Profil Admin</a></li>
      </ul>

      <div class="p-3 border-top">
        <a href="#" class="btn btn-outline-danger w-100 btn-logout"><i class="bi bi-box-arrow-right me-1"></i> Keluar</a>
      </div>
    </aside>

    <main class="admin-content">
      <header class="admin-header">
        <div class="d-flex align-items-center gap-3">
          <button class="btn btn-xiva-secondary d-lg-none" onclick="toggleAdminSidebar()">
            <i class="bi bi-list fs-5"></i>
          </button>
          <div>
            <h3 class="brand-font fw-bold mb-1">Manajemen Produk Jilbab</h3>
            <p class="text-muted mb-0">Kelola katalog jilbab, harga, stok, dan gambar</p>
          </div>
        </div>

        <a href="tambah-produk.html" class="btn btn-xiva-primary">
          <i class="bi bi-plus-lg me-1"></i> Tambah Produk Baru
        </a>
      </header>

      <div class="card card-xiva p-4 mb-4">
        <div class="row g-3 mb-3 align-items-center">
          <div class="col-md-6">
            <div class="input-group">
              <span class="input-group-text bg-white"><i class="bi bi-search text-muted"></i></span>
              <input type="text" id="admin-product-search" class="form-control" placeholder="Cari nama jilbab atau kategori...">
            </div>
          </div>
        </div>

        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead class="table-light">
              <tr>
                <th>#</th>
                <th>Gambar</th>
                <th>Nama Produk</th>
                <th>Kategori</th>
                <th>Harga</th>
                <th>Stok</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="admin-product-table-body">
              <!-- Dynamically populated -->
            </tbody>
          </table>
        </div>
      </div>
    </main>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/auth.js"></script>
  <script>AuthModule.requireAuth('admin');</script>
  <script src="../js/role.js"></script>
  <script src="../js/produk.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifikasi Email - XivaScarf</title>

  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="d-flex align-items-center justify-content-center py-5" style="background: linear-gradient(135deg, var(--secondary) 0%, var(--background) 100%); min-height: 100vh;">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card card-xiva p-4 p-md-5 text-center shadow-lg">
          <div class="stat-icon primary mx-auto mb-3" style="width: 72px; height: 72px; font-size: 2rem;">
            <i class="bi bi-envelope-check"></i>
          </div>

          <h3 class="brand-font fw-bold text-dark mb-2">Verifikasi Email Anda</h3>
          <p class="text-muted">
            Tautan konfirmasi telah dikirimkan ke email Anda (<strong class="user-display-email">user@xivascarf.com</strong>). Silakan periksa kotak masuk atau folder spam Anda.
          </p>

          <div class="alert alert-info py-2 my-3">
            <small><i class="bi bi-info-circle me-1"></i> Dalam mode demo, verifikasi email disimulasikan otomatis.</small>
          </div>

          <div class="d-grid gap-2 mt-4">
            <a href="user/home.html" class="btn btn-xiva-primary">
              <i class="bi bi-shop me-2"></i> Masuk ke Aplikasi / Belanja
            </a>
            <button onclick="showToast('Email verifikasi telah dikirim ulang!', 'info')" class="btn btn-xiva-secondary">
              <i class="bi bi-arrow-clockwise me-1"></i> Kirim Ulang Email
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/role.js"></script>
</body>
</html>

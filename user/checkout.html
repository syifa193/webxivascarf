<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout Pembelian - XivaScarf</title>

  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-xiva sticky-top">
    <div class="container">
      <a class="navbar-brand" href="home.html">
        <i class="bi bi-heart-pulse-fill text-primary" style="color: var(--primary) !important;"></i>
        <span>XivaScarf</span>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navCheckoutContent">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navCheckoutContent">
        <div class="d-flex align-items-center gap-3 ms-auto">
          <a href="keranjang.html" class="btn btn-xiva-secondary">
            <i class="bi bi-arrow-left me-1"></i> Kembali ke Keranjang
          </a>
        </div>
      </div>
    </div>
  </nav>

  <div class="container py-5">
    <h2 class="brand-font fw-bold mb-4"><i class="bi bi-shield-check text-primary me-2"></i>Formulir Checkout Pesanan</h2>

    <form id="checkout-form">
      <div class="row g-4">
        
        <!-- Shipping & Payment Form -->
        <div class="col-lg-7">
          <div class="card card-xiva p-4 mb-4">
            <h5 class="fw-bold mb-3"><i class="bi bi-geo-alt me-2 text-primary"></i>Alamat Pengiriman</h5>

            <div class="mb-3">
              <label for="namaPenerima" class="form-label">Nama Lengkap Penerima</label>
              <input type="text" id="namaPenerima" class="form-control" placeholder="Nama penerima paket" required>
            </div>

            <div class="mb-3">
              <label for="nohp" class="form-label">Nomor HP / WhatsApp Active</label>
              <input type="tel" id="nohp" class="form-control" placeholder="081234567890" required>
            </div>

            <div class="mb-3">
              <label for="alamat" class="form-label">Alamat Lengkap Tujuan</label>
              <textarea id="alamat" class="form-control" rows="3" placeholder="Jl. Mawar No. 12, Kel. Sukajadi, Kota Bandung, Jawa Barat" required></textarea>
            </div>
          </div>

          <div class="card card-xiva p-4">
            <h5 class="fw-bold mb-3"><i class="bi bi-credit-card me-2 text-primary"></i>Metode Pembayaran & Catatan</h5>

            <div class="mb-3">
              <label for="metodePembayaran" class="form-label">Pilih Metode Pembayaran</label>
              <select id="metodePembayaran" class="form-select" required>
                <option value="Transfer Bank BCA" selected>Transfer Bank BCA</option>
                <option value="ShopeePay">ShopeePay</option>
                <option value="GoPay">GoPay</option>
                <option value="OVO">OVO</option>
                <option value="COD">Cash On Delivery (COD)</option>
              </select>
            </div>

            <div id="payment-instructions" class="mb-3"></div>

            <div class="mb-3">
              <label for="catatan" class="form-label">Catatan Tambahan (Opsional)</label>
              <input type="text" id="catatan" class="form-control" placeholder="Contoh: Titip di satpam jika tidak ada orang">
            </div>
          </div>
        </div>

        <!-- Order Summary -->
        <div class="col-lg-5">
          <div class="card card-xiva p-4 sticky-top" style="top: 90px;">
            <h5 class="brand-font fw-bold mb-3">Ringkasan Produk</h5>
            <hr>

            <div id="checkout-summary-items" class="mb-3">
              <!-- Rendered dynamically -->
            </div>

            <hr>
            <div class="d-flex justify-content-between mb-2">
              <span class="text-muted">Ongkos Kirim</span>
              <span class="badge bg-success">Rp 0 (Gratis)</span>
            </div>
            <div class="d-flex justify-content-between mb-4 fs-5 fw-bold">
              <span>Total Pembayaran</span>
              <span id="checkout-total-price" style="color: var(--primary);">Rp 0</span>
            </div>

            <button type="submit" class="btn btn-xiva-primary btn-lg w-100 py-3">
              <i class="bi bi-check-circle me-2"></i> Buat Pesanan Sekarang
            </button>
          </div>
        </div>

      </div>
    </form>
  </div>

  <footer class="footer-xiva mt-5">
    <div class="container text-center">
      <p class="text-muted mb-0">&copy; 2026 XivaScarf Boutique.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/auth.js"></script>
  <script>AuthModule.requireAuth('user');</script>
  <script src="../js/role.js"></script>
  <script src="../js/produk.js"></script>
  <script src="../js/keranjang.js"></script>
  <script src="../js/checkout.js"></script>
</body>
</html>

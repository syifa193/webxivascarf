<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <!-- Bootstrap 5 CSS & Icons -->

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-xiva sticky-top">
    <div class="container">
      <a class="navbar-brand" href="home.html">
        <i class="bi bi-heart-pulse-fill text-primary" style="color: var(--primary) !important;"></i>
        <span>XivaScarf</span>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navProfilContent">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navProfilContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="home.html">Katalog Jilbab</a></li>
          <li class="nav-item"><a class="nav-link" href="riwayat.html">Riwayat Pembelian</a></li>
          <li class="nav-item"><a class="nav-link" href="wishlist.html">Wishlist</a></li>
        </ul>

        <div class="d-flex align-items-center gap-3">
          <a href="keranjang.html" class="btn btn-xiva-secondary position-relative me-2">
            <i class="bi bi-cart3"></i> Keranjang
            <span id="cart-badge-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
          </a>
          <div class="dropdown">
            <button class="btn btn-xiva-outline dropdown-toggle" type="button" data-bs-toggle="dropdown">
              <i class="bi bi-person-circle me-1"></i> <span class="user-display-name">Profil</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow">
              <li><a class="dropdown-item" href="profil.html"><i class="bi bi-person me-2"></i> Profil Saya</a></li>
              <li><a class="dropdown-item" href="riwayat.html"><i class="bi bi-bag-check me-2"></i> Riwayat Pesanan</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item text-danger btn-logout" href="#"><i class="bi bi-box-arrow-right me-2"></i> Keluar</a></li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <div class="container py-5">
    <h2 class="brand-font fw-bold mb-4"><i class="bi bi-person-circle text-primary me-2"></i>Pengaturan Profil Saya</h2>

    <div class="row">
      <div class="col-lg-8">
        <div class="card card-xiva p-4">
          <form id="user-profile-form">
            <div class="mb-3">
              <label for="cust-nama" class="form-label">Nama Lengkap</label>
              <input type="text" id="cust-nama" class="form-control" required>
            </div>

            <div class="mb-3">
              <label for="cust-email" class="form-label">Alamat Email</label>
              <input type="email" id="cust-email" class="form-control" readonly disabled>
              <small class="text-muted">Email tidak dapat diubah secara langsung.</small>
            </div>

            <div class="mb-3">
              <label for="cust-nohp" class="form-label">Nomor HP / WhatsApp Active</label>
              <input type="tel" id="cust-nohp" class="form-control" required>
            </div>

            <div class="mb-4">
              <label for="cust-alamat" class="form-label">Alamat Pengiriman Utama</label>
              <textarea id="cust-alamat" class="form-control" rows="3" required></textarea>
            </div>

            <button type="submit" class="btn btn-xiva-primary">
              <i class="bi bi-save me-1"></i> Simpan Perubahan Profil
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer-xiva mt-5">
    <div class="container text-center">
      <p class="text-muted mb-0">&copy; 2026 XivaScarf Boutique.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/auth.js"></script>
  <script>AuthModule.requireAuth('user');</script>
  <script src="../js/role.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const user = AuthModule.getCurrentUser();
      if (user) {
        document.getElementById('cust-nama').value = user.nama || '';
        document.getElementById('cust-email').value = user.email || '';
        document.getElementById('cust-nohp').value = user.nohp || '';
        document.getElementById('cust-alamat').value = user.alamat || '';
      }

      document.getElementById('user-profile-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const users = DBStore.getCollection(DBStore.KEYS.USERS);
        const idx = users.findIndex(u => u.uid === user.uid);
        if (idx !== -1) {
          users[idx].nama = document.getElementById('cust-nama').value.trim();
          users[idx].nohp = document.getElementById('cust-nohp').value.trim();
          users[idx].alamat = document.getElementById('cust-alamat').value.trim();

          DBStore.setCollection(DBStore.KEYS.USERS, users);
          AuthModule.setCurrentUser(users[idx]);
          showToast('Profil Anda berhasil diperbarui!', 'success');
        }
      });
    });
  </script>
</body>
</html>

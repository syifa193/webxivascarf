<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keranjang Belanja - XivaScarf</title>

  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-xiva sticky-top">
    <div class="container">
      <a class="navbar-brand" href="home.html">
        <i class="bi bi-heart-pulse-fill text-primary" style="color: var(--primary) !important;"></i>
        <span>XivaScarf</span>
      </a>

      <div class="d-flex align-items-center gap-3 ms-auto">
        <a href="home.html" class="btn btn-xiva-secondary">
          <i class="bi bi-shop me-1"></i> Lanjut Belanja
        </a>
      </div>
    </div>
  </nav>

  <div class="container py-5">
    <h2 class="brand-font fw-bold mb-4"><i class="bi bi-cart3 me-2 text-primary"></i>Keranjang Belanja</h2>

    <div class="row g-4">
      <!-- Cart Table -->
      <div class="col-lg-8">
        <div class="card card-xiva p-4">
          <div class="table-responsive">
            <table class="table align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th>Produk Jilbab</th>
                  <th>Harga</th>
                  <th>Jumlah</th>
                  <th>Subtotal</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="cart-table-body">
                <!-- Rendered dynamically -->
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Summary Card -->
      <div class="col-lg-4">
        <div class="card card-xiva p-4">
          <h5 class="brand-font fw-bold mb-3">Ringkasan Pesanan</h5>
          <hr>
          <div class="d-flex justify-content-between mb-2">
            <span class="text-muted">Subtotal Produk</span>
            <strong id="cart-subtotal">Rp 0</strong>
          </div>
          <div class="d-flex justify-content-between mb-3">
            <span class="text-muted">Biaya Pengiriman</span>
            <span class="badge bg-success">GRATIS ONGKIR</span>
          </div>
          <hr>
          <div class="d-flex justify-content-between mb-4 fs-5 fw-bold">
            <span>Total Bayar</span>
            <span id="cart-total" style="color: var(--primary);">Rp 0</span>
          </div>

          <a href="checkout.html" id="btn-proceed-checkout" class="btn btn-xiva-primary btn-lg w-100">
            <i class="bi bi-credit-card me-2"></i> Lanjut ke Checkout
          </a>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer-xiva mt-5">
    <div class="container text-center">
      <p class="text-muted mb-0">&copy; 2026 XivaScarf Boutique.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/auth.js"></script>
  <script>AuthModule.requireAuth('user');</script>
  <script src="../js/role.js"></script>
  <script src="../js/produk.js"></script>
  <script src="../js/keranjang.js"></script>
</body>
</html>

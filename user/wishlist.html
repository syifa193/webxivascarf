<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wishlist Saya - XivaScarf</title>

  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-xiva sticky-top">
    <div class="container">
      <a class="navbar-brand" href="home.html">
        <i class="bi bi-heart-pulse-fill text-primary" style="color: var(--primary) !important;"></i>
        <span>XivaScarf</span>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navWishlistContent">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navWishlistContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="home.html">Katalog Jilbab</a></li>
          <li class="nav-item"><a class="nav-link" href="riwayat.html">Riwayat Pembelian</a></li>
          <li class="nav-item"><a class="nav-link active" href="wishlist.html">Wishlist</a></li>
        </ul>

        <div class="d-flex align-items-center gap-3">
          <a href="keranjang.html" class="btn btn-xiva-secondary position-relative me-2">
            <i class="bi bi-cart3"></i> Keranjang
            <span id="cart-badge-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
          </a>
          <div class="dropdown">
            <button class="btn btn-xiva-outline dropdown-toggle" type="button" data-bs-toggle="dropdown">
              <i class="bi bi-person-circle me-1"></i> <span class="user-display-name">Pelanggan</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow">
              <li><a class="dropdown-item" href="profil.html"><i class="bi bi-person me-2"></i> Profil Saya</a></li>
              <li><a class="dropdown-item" href="riwayat.html"><i class="bi bi-bag-check me-2"></i> Riwayat Pesanan</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item text-danger btn-logout" href="#"><i class="bi bi-box-arrow-right me-2"></i> Keluar</a></li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <div class="container py-5">
    <h2 class="brand-font fw-bold mb-4"><i class="bi bi-heart-fill text-danger me-2"></i>Wishlist Favorit Saya</h2>

    <div id="wishlist-grid" class="row">
      <!-- Populate dynamically -->
    </div>
  </div>

  <footer class="footer-xiva mt-5">
    <div class="container text-center">
      <p class="text-muted mb-0">&copy; 2026 XivaScarf Boutique.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/auth.js"></script>
  <script>AuthModule.requireAuth('user');</script>
  <script src="../js/role.js"></script>
  <script src="../js/produk.js"></script>
  <script src="../js/keranjang.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderWishlistGrid();
    });

    function renderWishlistGrid() {
      const user = AuthModule.getCurrentUser();
      const container = document.getElementById('wishlist-grid');
      if (!user || !container) return;

      const wishlist = DBStore.getCollection(DBStore.KEYS.WISHLIST).filter(w => w.uid === user.uid);
      const products = ProductModule.getAll();

      const savedProducts = wishlist.map(w => products.find(p => p.idProduk === w.produkId)).filter(Boolean);

      if (savedProducts.length === 0) {
        container.innerHTML = `
          <div class="col-12 text-center py-5">
            <i class="bi bi-heartbreak display-1 text-muted"></i>
            <h5 class="mt-3 text-muted">Belum ada produk impian di Wishlist</h5>
            <p class="text-muted">Jelajahi koleksi jilbab dan tekan tombol hati pada detail produk.</p>
            <a href="home.html" class="btn btn-xiva-primary">Cari Jilbab Sekarang</a>
          </div>
        `;
        return;
      }

      container.innerHTML = savedProducts.map(p => `
        <div class="col-6 col-md-4 col-lg-3 mb-4">
          <div class="card card-xiva product-card">
            <div class="img-wrapper">
              <img src="${p.gambar}" alt="${p.nama}">
            </div>
            <div class="card-body">
              <a href="detail-produk.html?id=${p.idProduk}" class="product-title">${p.nama}</a>
              <div class="product-price">${ProductModule.formatRupiah(p.harga)}</div>
              <div class="d-grid gap-2 mt-auto">
                <button class="btn btn-xiva-primary btn-sm" onclick="moveToCartFromWishlist('${p.idProduk}')">
                  <i class="bi bi-cart-plus me-1"></i> Tambah Keranjang
                </button>
                <button class="btn btn-outline-danger btn-sm" onclick="removeWishlist('${p.idProduk}')">
                  <i class="bi bi-trash me-1"></i> Hapus Wishlist
                </button>
              </div>
            </div>
          </div>
        </div>
      `).join('');
    }

    function moveToCartFromWishlist(produkId) {
      const user = AuthModule.getCurrentUser();
      CartModule.addItem(user.uid, produkId, 1);
      showToast('Produk ditambahkan ke keranjang!', 'success');
      updateCartBadge();
    }

    function removeWishlist(produkId) {
      const user = AuthModule.getCurrentUser();
      let wishlist = DBStore.getCollection(DBStore.KEYS.WISHLIST);
      wishlist = wishlist.filter(w => !(w.uid === user.uid && w.produkId === produkId));
      DBStore.setCollection(DBStore.KEYS.WISHLIST, wishlist);
      showToast('Dihapus dari Wishlist.', 'info');
      renderWishlistGrid();
    }
  </script>
</body>
</html>
